openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: STACK Service Desk AI Solution API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tickets
    description: Ticket management
  - name: dashboard
    description: Dashboard data
  - name: reports
    description: Analytics and reports
  - name: roi
    description: ROI metrics
  - name: logs
    description: Audit and system logs
  - name: admin
    description: Administration
  - name: sops
    description: SOP management
  - name: chat
    description: Chat interface
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"

  /v1/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets with filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: use_case
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: sla_status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /v1/tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/tickets/{id}/resolve:
    post:
      operationId: resolveTicket
      tags: [tickets]
      summary: Trigger AI resolution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiResolution"

  /v1/tickets/{id}/escalate:
    post:
      operationId: escalateTicket
      tags: [tickets]
      summary: Manual escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateInput"
      responses:
        "200":
          description: Escalation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/tickets/{id}/notes:
    get:
      operationId: getTicketNotes
      tags: [tickets]
      summary: Get ticket notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketNote"
    post:
      operationId: addTicketNote
      tags: [tickets]
      summary: Add note to ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketNote"

  /v1/tickets/{id}/timeline:
    get:
      operationId: getTicketTimeline
      tags: [tickets]
      summary: Full ticket audit timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary KPIs
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /v1/dashboard/live-queue:
    get:
      operationId: getLiveQueue
      tags: [dashboard]
      summary: Live open ticket queue
      responses:
        "200":
          description: Live queue tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /v1/dashboard/sla-at-risk:
    get:
      operationId: getSlaAtRisk
      tags: [dashboard]
      summary: SLA at risk tickets
      responses:
        "200":
          description: At-risk tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /v1/dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent audit activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /v1/reports/resolution-rate:
    get:
      operationId: getResolutionRate
      tags: [reports]
      summary: Resolution rate by use case
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resolution rate data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolutionRateReport"

  /v1/reports/sla-compliance:
    get:
      operationId: getSlaCompliance
      tags: [reports]
      summary: SLA compliance report
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SLA compliance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaComplianceReport"

  /v1/reports/ticket-trends:
    get:
      operationId: getTicketTrends
      tags: [reports]
      summary: Ticket volume trends
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        "200":
          description: Ticket trends data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTrendsReport"

  /v1/reports/ai-accuracy:
    get:
      operationId: getAiAccuracy
      tags: [reports]
      summary: AI confidence and accuracy analytics
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: AI accuracy data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAccuracyReport"

  /v1/reports/agent-performance:
    get:
      operationId: getAgentPerformance
      tags: [reports]
      summary: Agent performance metrics
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Agent performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentPerformance"

  /v1/roi/current:
    get:
      operationId: getCurrentRoi
      tags: [roi]
      summary: Current period ROI metrics
      responses:
        "200":
          description: Current ROI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoiMetric"

  /v1/roi/history:
    get:
      operationId: getRoiHistory
      tags: [roi]
      summary: Historical ROI by period
      responses:
        "200":
          description: ROI history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoiMetric"

  /v1/roi/settings:
    patch:
      operationId: updateRoiSettings
      tags: [roi]
      summary: Update ROI cost settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoiSettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/logs/audit:
    get:
      operationId: getAuditLogs
      tags: [logs]
      summary: Paginated audit logs
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
        - name: actor_type
          in: query
          schema:
            type: string
        - name: use_case
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /v1/logs/api-calls:
    get:
      operationId: getApiCallLogs
      tags: [logs]
      summary: API call logs
      parameters:
        - name: api_name
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: API call logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCallLogListResponse"

  /v1/logs/powershell:
    get:
      operationId: getPowershellLogs
      tags: [logs]
      summary: PowerShell execution logs
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: PowerShell logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsLogListResponse"

  /v1/admin/thresholds:
    get:
      operationId: getThresholds
      tags: [admin]
      summary: Get confidence thresholds
      responses:
        "200":
          description: Confidence thresholds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceThreshold"

  /v1/admin/thresholds/{id}:
    patch:
      operationId: updateThreshold
      tags: [admin]
      summary: Update confidence threshold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThresholdUpdate"
      responses:
        "200":
          description: Threshold updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfidenceThreshold"

  /v1/admin/sla-configs:
    get:
      operationId: getSlaConfigs
      tags: [admin]
      summary: Get SLA configurations
      responses:
        "200":
          description: SLA configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaConfig"

  /v1/admin/sla-configs/{id}:
    patch:
      operationId: updateSlaConfig
      tags: [admin]
      summary: Update SLA config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaConfigUpdate"
      responses:
        "200":
          description: SLA config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaConfig"

  /v1/admin/groups:
    get:
      operationId: getAgentGroups
      tags: [admin]
      summary: Get agent groups
      responses:
        "200":
          description: Agent groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentGroup"

  /v1/admin/groups/{id}:
    patch:
      operationId: updateAgentGroup
      tags: [admin]
      summary: Update agent group
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentGroupUpdate"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGroup"

  /v1/admin/agents:
    get:
      operationId: listAgents
      tags: [admin]
      summary: List agents
      responses:
        "200":
          description: Agents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [admin]
      summary: Add agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /v1/admin/agents/{id}:
    patch:
      operationId: updateAgent
      tags: [admin]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /v1/sops:
    get:
      operationId: listSops
      tags: [sops]
      summary: List all SOPs
      responses:
        "200":
          description: SOPs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sop"
    post:
      operationId: createSop
      tags: [sops]
      summary: Upload new SOP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopInput"
      responses:
        "201":
          description: SOP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sop"

  /v1/sops/{id}:
    get:
      operationId: getSop
      tags: [sops]
      summary: Get SOP detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SOP detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sop"
    patch:
      operationId: updateSop
      tags: [sops]
      summary: Update SOP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopUpdate"
      responses:
        "200":
          description: SOP updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sop"
    delete:
      operationId: deleteSop
      tags: [sops]
      summary: Deactivate SOP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SOP deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/sops/search:
    post:
      operationId: searchSops
      tags: [sops]
      summary: Semantic search SOPs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopSearchInput"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sop"

  /v1/chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send chat message (Google Chat Bot integration point)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthToken:
      type: object
      required: [token, agent]
      properties:
        token:
          type: string
        agent:
          $ref: "#/components/schemas/Agent"

    Agent:
      type: object
      required: [agent_id, email, full_name, role, is_active]
      properties:
        agent_id:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [admin, agent, readonly]
        freshservice_agent_id:
          type: ["string", "null"]
        is_active:
          type: boolean
        created_at:
          type: string

    AgentInput:
      type: object
      required: [email, full_name, role]
      properties:
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [admin, agent, readonly]
        freshservice_agent_id:
          type: string

    AgentUpdate:
      type: object
      properties:
        full_name:
          type: string
        role:
          type: string
          enum: [admin, agent, readonly]
        is_active:
          type: boolean

    Ticket:
      type: object
      required: [ticket_id, title, use_case, status, priority, sla_status, source, created_at]
      properties:
        ticket_id:
          type: string
        freshservice_ticket_id:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        use_case:
          type: string
          enum: [sharepoint_access, sharepoint_admin, license_bluebeam, license_adobe, license_o365, dl_update, windows_troubleshooting]
        status:
          type: string
          enum: [open, in_progress, auto_resolved, escalated, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        sla_deadline:
          type: ["string", "null"]
        sla_status:
          type: string
          enum: [safe, at_risk, breached]
        sla_breach_predicted:
          type: boolean
        source:
          type: string
          enum: [freshservice, web_dashboard, google_chat]
        assigned_agent_id:
          type: ["string", "null"]
        assigned_agent_name:
          type: ["string", "null"]
        resolution_type:
          type: ["string", "null"]
        confidence_score:
          type: ["number", "null"]
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]
        closed_at:
          type: ["string", "null"]

    TicketDetail:
      type: object
      required: [ticket_id, title, use_case, status, priority, sla_status, source, created_at]
      properties:
        ticket_id:
          type: string
        freshservice_ticket_id:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        use_case:
          type: string
          enum: [sharepoint_access, sharepoint_admin, license_bluebeam, license_adobe, license_o365, dl_update, windows_troubleshooting]
        status:
          type: string
          enum: [open, in_progress, auto_resolved, escalated, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        sla_deadline:
          type: ["string", "null"]
        sla_status:
          type: string
          enum: [safe, at_risk, breached]
        sla_breach_predicted:
          type: boolean
        source:
          type: string
          enum: [freshservice, web_dashboard, google_chat]
        assigned_agent_id:
          type: ["string", "null"]
        assigned_agent_name:
          type: ["string", "null"]
        resolution_type:
          type: ["string", "null"]
        confidence_score:
          type: ["number", "null"]
        created_at:
          type: string
        updated_at:
          type: ["string", "null"]
        closed_at:
