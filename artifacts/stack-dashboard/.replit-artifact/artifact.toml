kind = "web"
previewPath = "/"
title = "STACK Service Desk AI Dashboard"
version = "1.0.0"
id = "artifacts/stack-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25473

[services.development]
run = "pnpm --filter @workspace/stack-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stack-dashboard", "run", "build" ]
publicDir = "artifacts/stack-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25473"
BASE_PATH = "/"
